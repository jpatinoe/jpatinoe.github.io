<section class="group" id="{{ include.id }}" aria-labelledby="h-{{ include.id }}">
  <div class="gh">
    <h2 id="h-{{ include.id }}">{{ include.title }}</h2>
    {%- if include.intro %}
    <p>{{ include.intro }}</p>
    {%- endif %}
  </div>
  {% if include.tiles %}{% include tiles.html items=include.items %}{% else %}{% include rows.html items=include.items home=include.home %}{% endif %}
</section>
