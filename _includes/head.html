<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.home %}{{ site.title }}{% else %}{{ page.title }} | {{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.lede | default: site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{% if page.home %}{{ site.title }}{% else %}{{ page.title }} | {{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.lede | default: site.description }}">
<script>
  document.documentElement.classList.add('js');
  (function () {
    // the visitor's light/dark choice: sessionStorage for this visit, localStorage for the next one
    var t = null;
    try { t = sessionStorage.getItem('jpe-theme'); } catch (e) {}
    if (!t) { try { t = localStorage.getItem('jpe-theme'); } catch (e) {} }
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-jpe-theme', t);
  })();
</script>
<style>
:root {
  /* Layout: a live, computed flow fills the first screen; the name sits bottom-left on it and the four
     destinations sit on the flow's equilibria. Below, a 3/9 split: section names in the margin, outbound links on the right. */
  --paper: #F4F6F7;
  --paper-2: #E8ECEF;
  --ink: #14181C;
  --ink-2: #59616A;
  --rule: #D9DEE2;
  --red: #C8102E;
  --blue: #1F4FBF;
  --accent: var(--red);
  --font: "Schibsted Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --gutter: clamp(16px, 4vw, 56px);
  --bar-h: 56px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-jpe-theme="light"]) {
    --paper: #0E1419; --paper-2: #152029; --ink: #E6EAED; --ink-2: #9AA4AD; --rule: #24303A;
    --red: #FF5A5F; --blue: #7FA6FF; color-scheme: dark;
  }
}
:root[data-jpe-theme="dark"] {
  --paper: #0E1419; --paper-2: #152029; --ink: #E6EAED; --ink-2: #9AA4AD; --rule: #24303A;
  --red: #FF5A5F; --blue: #7FA6FF; color-scheme: dark;
}
:root[data-jpe-accent="blue"] { --accent: var(--blue); }
html { background: var(--paper); color: var(--ink); }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
