<section class="band" id="top" aria-labelledby="page-title" data-anchors='{"desktop":[{{ page.band.desktop }}],"phone":[{{ page.band.phone }}]}'>
  <canvas class="field" id="field" aria-hidden="true"></canvas>
  <div class="masthead">
    <h1 id="page-title">{{ page.title }}</h1>
    <p>{{ page.lede }}</p>
  </div>
  <div class="equilibria" aria-hidden="true"><span class="eq still"><span class="dot"></span></span></div>
  <button class="iconbtn hold" id="hold" type="button" aria-pressed="false" aria-label="Pause the animation" title="Pause the animation">
    <svg class="ic-pause" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5v10M13 5v10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <svg class="ic-play" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4.5v11l9-5.5z" fill="currentColor"/></svg>
  </button>
</section>
